name: student_information_system
description: A Flutter Student Information System using SQLite.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  sqflite: ^2.4.4+1
  sqflite_common_ffi: ^2.3.6
  sqflite_common_ffi_web: ^1.0.0
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true